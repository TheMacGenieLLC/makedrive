# makedrive.conf
#
# Configuration file for makedrive.command
#
# Created by:
# Ian Williams, The Mac Genie LLC
# ian@themacgenie.com
#
# https://makedrive.com
#
# Edit this file to update software versions, add new installers, or change
# build drive configurations. makedrive.command reads it at startup from
# ~/Library/Application Support/makedrive. A copy placed beside the script
# replaces that one at the next launch (the old one is archived).
#
# Adding a new installer requires a new image definition block below (with
# MenuLabel and AddFunc). makedrive.command builds its menus from these
# blocks, so there's no menu list to update. The key does still need adding
# to the buildTypeN_volumes list of each drive type that should carry it.
# Nothing warns you if you forget; that macOS just never lands on a drive.

# ==============================================================================
# Operational Settings
# ==============================================================================

# DataDrive partition: temporary name used during disk partitioning, final name
# visible in Finder, partition size (0G = use remaining disk space), filesystem.
dataDriveStartName="DataDriveTempFolder"
dataDriveFinalName="DataDrive"
dataDriveVolSize="0G"
dataDriveVolType="JHFS+"

# Seconds to wait after disabling Spotlight on each deployed volume.
spotlightSleepInSeconds=2

# The format dmgtool_compress_dmg converts images to (Type), and the word it
# looks for in hdiutil's report to tell an image is already compressed (String).
dmgCompressionType="ULFO"
dmgCompressionString="lzfse"

# Apple Software Update catalog index URLs. A new one appears on Apple's CDN
# with the first developer preview of each macOS generation. Add it here and
# makedrive tracks it automatically. Newest first, so the freshest catalog wins.
catalogURLs=(
    "https://swscan.apple.com/content/catalogs/others/index-27-26-15-14-13-12-10.16-10.15-10.14-10.13-10.12-10.11-10.10-10.9-mountainlion-lion-snowleopard-leopard.merged-1.sucatalog.gz"
    "https://swscan.apple.com/content/catalogs/others/index-26-15-14-13-12-10.16-10.15-10.14-10.13-10.12-10.11-10.10-10.9-mountainlion-lion-snowleopard-leopard.merged-1.sucatalog.gz"
)

# ==============================================================================
# Build Type Configurations
# ==============================================================================
# Each build type requires the following variables (replace XX with the type
# number shown in the build menu, e.g. 1, 2, 3):
#
#   buildTypeXX_volumes  - Ordered array of image keys and "dataDrive" to build
#                          (dataDrive goes last: nothing after it is deployed)
#   buildTypeXX_scheme   - Partition scheme: GPT (Intel/AS) or APM (PowerPC)
#   buildTypeXX_label    - Short label shown in the build drive menu
#   buildTypeXX_detail   - Size/description shown below the label in the menu
#                          (derived by makedrive.command for types whose
#                          volumes are sized in GB; hand-write it otherwise)
#
# buildTypeNums (the registry of valid type numbers, in menu display order) is
# derived by makedrive.command from the buildTypeXX_label keys defined below
# (see conf_derive_build_types in the script). No separate list to update here.

# ------------------------------------------------------------------------------
# Type 1 - Apple Silicon & Intel Installers
# ------------------------------------------------------------------------------
buildType1_volumes=( "inst2700a" "inst2600u" "inst1500u" "inst1400u" "inst1300u" "inst1200u" "inst1100u" "inst1015i" "inst1014i" "inst1013i" "inst1012i" "inst1011i" "inst1010i" "inst109i" "inst108i" "inst107i" "inst106i" "dataDrive" )
buildType1_scheme="GPT"
buildType1_label="Apple Silicon & Intel Installers"

# ------------------------------------------------------------------------------
# Type 2 - Older PPC & Intel Installers
# ------------------------------------------------------------------------------
buildType2_volumes=( "inst1011i" "inst1010i" "inst109i" "inst108i" "inst107i" "inst106i" "inst105u" "inst104i" "inst104p" "inst103p" "dataDrive" )
buildType2_scheme="APM"
buildType2_label="Older PPC & Intel 10.3-10.11 Installers"

# ------------------------------------------------------------------------------
# Type 3 - DataDrive Only
# ------------------------------------------------------------------------------
buildType3_volumes=( "dataDrive" )
buildType3_scheme="GPT"
buildType3_label="DataDrive Only"
buildType3_detail="About 200GB for images and data"

# Intel diagnostics on one Apple Partition Map disk. asr has historically
# failed to remount many-volume GPT disks during ASD builds
# (rdar://problem/9720530), and every Mac these tools support boots APM.
# The detail is set by hand because the EFI volumes are sized in megabytes,
# which the automatic size derivation does not sum.
buildType4_volumes=( "bbSerial" "asd123efi" "asd132efi" "asd138efi" "asd139efi" "asd140efi" "asd142efi" "asd144efi" "asd145efi" "asd146efi" "asd147efi" "asd148efi" "asd149efi" "asd155efi" "asd156efi" "asd157efi" "asd159efi" "asd162efi" "asd123os" "asd132os" "asd138os" "asd139os" "asd140os" "asd142os" "asd144os" "asd145os" "asd146os" "asd147os" "asd148os" "asd149os" "asd155os" "asd156os" "asd157os" "asd159os" "asd162os" "axd104efi" "axd106efi" "axd107efi" "axd109efi" "axd111efi" "dataDrive" )
buildType4_scheme="APM"
buildType4_label="Intel ASD & AXD Diagnostics"
buildType4_detail="About 210GB plus DataDrive"

# ==============================================================================
# Image Definitions
# ==============================================================================
#
# Each image entry is a set of shell variables sharing a unique key prefix
# (e.g. inst1015i, inst1500u). For installers, the trailing letter indicates
# platform compatibility, not beta status: p = PowerPC, u = Universal,
# i = Intel, a = Apple Silicon. Five deploy types are supported:
#
#   GENERIC  - Mac App Store installer. makedrive runs createinstallmedia to
#              build a bootable DMG, stores it in restorekit, and restores it
#              to target volumes via asr.
#   INST-A   - Pre-built or legacy DMG copied directly into restorekit and
#              restored via asr.
#   ASD-EFI  - Apple Service Diagnostics EFI DMG (also AXD 3X111) restored via
#              asr, then blessed at the volume root where its boot files live.
#   AXD-PKG  - Apple Server Diagnostics EFI volume populated by running the
#              installer package Apple shipped on the source DMG. The install
#              ignores the package's signing: 3X109's certificate expired long
#              ago, and the older packages aren't signed at all.
#   COPY     - Volume that asr cannot restore (the Blank Board Serializer);
#              contents are soft-cloned onto the target from a mounted copy.
#
# Required for all image types:
#   instXXXX              - Path to the DMG in restorekit (use $executionPath)
#   instXXXXDeployType    - Deploy type from the list above (e.g. "GENERIC")
#   instXXXXDispName      - Full display name for menus and progress output
#   instXXXXFinalName     - Volume name after deployment (visible in Finder)
#   instXXXXStartName     - Temporary partition name used during disk setup
#   instXXXXVolSize       - Partition size (e.g. "22.0G"). diskutil counts decimal
#                           GB but the image below is sized in binary GiB, so for
#                           a GENERIC image this has to be about 2 larger than its
#                           NewImageVolSize ("21.0G" image, "23.0G" partition) or
#                           asr refuses the restore. makedrive checks this at
#                           launch.
#   instXXXXVolType       - Filesystem type (e.g. "JHFS+")
#   instXXXXBuildNumber   - macOS build string to verify the source before
#                           adding to restorekit (e.g. "24G85"); empty = skip
#                           that check (the re-signing 10.14 and 10.15 need is
#                           decided from the installer's own build instead). The
#                           AXD diagnostics use the ProductBuildVersion in their
#                           own version.plist ("7A88" for 3X106), which is what
#                           tells apart images that share a volume name. Any
#                           other copied image that isn't an install DVD or ESD
#                           would be refused if it named a build, so leave it
#                           empty for those
#   instXXXXMenuLabel     - Short label shown in the add image menu
#   instXXXXAddFunc       - Function that adds this image to restorekit:
#                             COPY_SINGLE              - INST-A and diagnostic entries
#                             CREATE_INSTALL_MEDIA     - GENERIC, Mojave and later
#                             CREATE_INSTALL_MEDIA_MAV - GENERIC, Mavericks-High Sierra
#
# Optional, for an installer the download menu fetches from a fixed Apple link
# (10.7 to 10.12; Apple's catalog lists the newer ones, and 10.9 can't be
# downloaded at all). Set both or neither, and the link has to be https:
#   instXXXXDownloadURL   - Where Apple serves the installer DMG
#   instXXXXDownloadBytes - Its size in bytes, which the download must match
#
# Additional variables for GENERIC images only:
#   instXXXXAppPath          - Path to the installer app in /Applications
#   instXXXXNewImageVolSize  - Capacity of the temp DMG createinstallmedia writes
#                              the installer into (e.g. "21.0G"). Leave about 1 GiB
#                              spare: a finished image takes Apple's package size
#                              plus roughly 2 GiB, though 27.2 came out only 0.1
#                              over (a 26 image in a 20G image came out 97% full)
#
# Additional variables for INST-A images only:
#   instXXXXSourceImagePath  - Path to the source DMG within the app bundle
#                              (optional; if empty the user is prompted to drag
#                              the file into Terminal)
#
# Required for INST-A, ASD-EFI, AXD-PKG, and COPY images:
#   instXXXXVolName          - Volume name the source DMG presents when mounted
#                              or restored; may differ from FinalName
#                              (e.g. "Mac OS X Install ESD", renamed to FinalName)
#
# Additional variables for AXD-PKG images only:
#   instXXXXPkgName          - Installer package filename inside the mounted DMG
#   instXXXXPkgTgtVolName    - Volume name Apple's package gives the target
#                              volume during install (renamed to FinalName)

