# ==============================================================================
# Diagnostic Image Definitions
# ==============================================================================
#
# Apple discontinued ASD after the 2015 Intel model years, so this list is
# complete and will not grow. It lives at the end of the file to keep the
# routinely edited installer and build type sections up top; placement has
# no effect on menus, which derive separately per image family. The variable
# schema is documented in the Image Definitions section above.

# ------------------------------------------------------------------------------
